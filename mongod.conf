 cat /etc/mongod.conf
# mongod.conf - Percona Server for MongoDB - Standalone

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

  wiredTiger:
    engineConfig:
      checkpointSizeMB: 1000

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

processManagement:
  fork: true
  pidFilePath: /var/run/mongod.pid

net:
  port: 27017
  bindIp: 0.0.0.0

# Standalone MongoDB - no replication configuration